aid: bastille-networks
name: Bastille Networks
description: 'Bastille Networks is a wireless airspace cybersecurity company that
  detects, localizes, and continuously monitors radio-frequency emitting devices
  and threats across 50+ wireless protocols including Bluetooth, BLE, Wi-Fi,
  cellular, and IoT. Its platform delivers real-time inventory of wireless assets,
  rogue-device and insider-threat detection, and localization down to a 1-3 meter
  radius, integrating through an API-led architecture with SIEM, SOAR, XDR, and
  CAASM tooling such as Splunk, ArcSight, and QRadar. Bastille serves Fortune 100
  enterprises, government agencies, classified facilities, and data center
  operators, and is a portfolio company of Bessemer Venture Partners. It exposes
  integration APIs to enterprise customers but publishes no public developer
  portal or OpenAPI specification.'
